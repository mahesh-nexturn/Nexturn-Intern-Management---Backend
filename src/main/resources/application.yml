spring:
  application:
    name: intern-management-backend
  main:
    lazy-initialization: true
    banner-mode: "off"
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${APP_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${APP_MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jmx:
    enabled: false
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/intern_management
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns schema, JPA only validates
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  health:
    mail:
      enabled: false

app:
  file-storage:
    location: ${APP_UPLOAD_DIR:uploads}
  mail:
    from: ${APP_MAIL_FROM:}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-in-prod-0123456789}
  access-token-expiry-ms: 900000      # 15 min
  refresh-token-expiry-ms: 604800000  # 7 days

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nexturn.internmanagement: INFO
