spring:
  application:
    name: intern-management-backend
  main:
    lazy-initialization: true
    banner-mode: "off"
  jmx:
    enabled: false
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/intern_management
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns schema, JPA only validates
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  aws:
    region: ${AWS_REGION:ap-south-1}
  s3:
    bucket: ${APP_S3_BUCKET:}
  sns:
    topic-arn: ${APP_SNS_TOPIC_ARN:}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-in-prod-0123456789}
  access-token-expiry-ms: 900000      # 15 min
  refresh-token-expiry-ms: 604800000  # 7 days

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nexturn.internmanagement: INFO
